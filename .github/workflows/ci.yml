name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall app

      - name: Verify modules import cleanly
        run: |
          python -c "
          import app.config, app.db, app.ai.router, app.content_sync.listener, \
                 app.customer_bot.bot, app.admin_bot.bot, app.scheduler.jobs, app.main
          print('all modules import OK')
          "
